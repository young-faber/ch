<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verification</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f0f0f;
    font-family:Arial, Helvetica, sans-serif;
    color:white;
}

.container{
    background:#1c1c1c;
    padding:40px;
    border-radius:12px;
    width:320px;
    box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

h1{
    margin-top:0;
    font-size:22px;
    text-align:center;
}

p{
    font-size:14px;
    opacity:0.8;
    text-align:center;
}

input[type="text"]{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:6px;
    background:#2b2b2b;
    color:white;
    font-size:16px;
}

input[type="text"]:focus{
    outline:none;
    background:#333;
}

input[type="submit"]{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:6px;
    background:#4f7cff;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

input[type="submit"]:hover{
    background:#3c63d9;
}

.message{
    padding:10px;
    border-radius:6px;
    margin-bottom:10px;
    font-size:14px;
}

.message.error{
    background:#3b1e1e;
    color:#ff6b6b;
}

.message.success{
    background:#1e3b26;
    color:#5dff9a;
}

</style>

</head>

<body>

<div class="container">

<h1>Email Verification</h1>

{% if messages %}
    {% for message in messages %}
        <div class="message {{message.tags}}">
            {{message}}
        </div>
    {% endfor %}
{% endif %}

<form method="post">
    {% csrf_token %}
    <input type="text" name="code" placeholder="Enter verification code">
    <input type="submit" value="Verify">
</form>

<p>
Введите код верификации, который был отправлен на вашу почту. Если письма нет, проверьте <span style="color: red;">"Спам"</span> 
</p>
