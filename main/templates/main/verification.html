<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    {% if messages %} {% for message in messages %}
    <div class="message {{message.tags}}">{{message}}</div>
    {% endfor%} {% endif %}
    <form method="post">
        {% csrf_token %}
      <input type="text" name="code" />
      <input type="submit" />
    </form>
  </body>
</html>
