<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #e1bee7);
            margin: 0;
            padding: 0;
            color: #333;
        }

        h1 {
            text-align: center;
            margin: 30px 0;
            font-size: 2rem;
            font-weight: 700;
            color: #5e35b1;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* User card */
        .user-card {
            position: fixed;
            top: 20px;
            right: 20px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            font-size: 14px;
            transition: transform 0.2s;
        }

        .user-card:hover {
            transform: translateY(-2px);
        }

        .user-card .icon {
            font-size: 22px;
        }

        .user-card .label {
            font-size: 12px;
            color: #999;
        }

        .user-card .name {
            font-weight: 600;
            color: #5e35b1;
        }

        /* Main container */
        .main-container {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            gap: 30px;
            padding: 20px 40px;
            margin-top: 120px;
        }

        .block {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-radius: 16px;
            gap: 15px;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .block:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        /* Create Game */
        .create {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .create p {
            margin: 0;
            font-weight: 600;
            color: #5e35b1;
        }

        .create label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .create input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #5e35b1;
            cursor: pointer;
        }

        .create button {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6a1b9a, #8e24aa);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .create button:hover {
            background: linear-gradient(135deg, #8e24aa, #ab47bc);
            transform: translateY(-2px);
        }

        /* Logout button */
        .logout-block button {
            padding: 10px 25px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #d32f2f, #f44336);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .logout-block button:hover {
            background: linear-gradient(135deg, #f44336, #e57373);
            transform: translateY(-2px);
        }

        /* Connect button */
        .connect-block label {
            padding: 12px 28px;
            background: linear-gradient(135deg, #0288d1, #03a9f4);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s, transform 0.2s;
        }

        .connect-block label:hover {
            background: linear-gradient(135deg, #03a9f4, #29b6f6);
            transform: translateY(-2px);
        }

        /* Modal */
        #joinModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #joinToggle:checked + #joinModal {
            display: flex;
        }

        #joinModal .modal-content {
            background: #fff;
            padding: 25px;
            border-radius: 16px;
            width: 320px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }

        #joinModal .modal-content h3 {
            margin: 0;
            color: #5e35b1;
        }

        #joinModal .modal-content input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #bbb;
            font-size: 14px;
        }

        #joinModal .modal-content button {
            padding: 10px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #2e7d32, #43a047);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        #joinModal .modal-content button:hover {
            background: linear-gradient(135deg, #43a047, #66bb6a);
            transform: translateY(-2px);
        }

        #joinModal .modal-content .cancel-label {
            padding: 10px;
            background: linear-gradient(135deg, #c62828, #e53935);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s, transform 0.2s;
        }

        #joinModal .modal-content .cancel-label:hover {
            background: linear-gradient(135deg, #e53935, #ef5350);
            transform: translateY(-2px);
        }

        /* Hidden checkbox */
        #joinToggle {
            position: absolute;
            left: -9999px;
        }

        .verify-msg {
            font-weight: 600;
            color: #5e35b1;
        }

    </style>
</head>
<body>
    <h1>Lobby</h1>

    <!-- User card -->
    <div class="user-card">
        <span class="icon">👤</span>
        <div>
            <div class="label">Вы вошли как</div>
            <div class="name">{{request.user}}</div>
        </div>
    </div>

    <!-- Main container -->
    <div class="main-container">
        {% if not request.user.is_verified %}
            <div class="verify-msg">Зайди на почту</div>
        {% endif %}

        <!-- Create game block -->
        <div class="block create">
            <form action="{% url 'game:create_game' %}" method="post">
                {% csrf_token %}
                <p>Выбери цвет:</p>
                <label><input type="radio" name="color" value="white"> white</label>
                <label><input type="radio" name="color" value="black"> black</label>
                <label><input type="radio" name="color" value="random"> random</label>
                <button type="submit">Создать игру</button>
            </form>
        </div>

        <!-- Logout block -->
        <div class="block logout-block">
            <a href="{% url 'user:logout' %}">
                <button>Logout</button>
            </a>
        </div>

        <!-- Connect block -->
        <div class="block connect-block">
            <label for="joinToggle">Connect</label>
        </div>
    </div>

    <!-- Hidden checkbox -->
    <input type="checkbox" id="joinToggle">

    <!-- Modal -->
    <div id="joinModal">
        <div class="modal-content">
            <h3>Войти в игру</h3>
            <form method="get" action="{% url 'game:join_game' %}">
                <input type="text" name="id" placeholder="ID игры">
                <button type="submit">Join</button>
            </form>
            <label for="joinToggle" class="cancel-label">Cancel</label>
        </div>
    </div>
</body>
</html>
