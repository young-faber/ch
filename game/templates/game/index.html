{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'css/game.css' %}" />
    <title>Chess Board</title>
    <style>
      /* Стили для модального окна сдачи */
      .surrender-modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        align-items: center;
        justify-content: center;
      }

      .surrender-modal.active {
        display: flex;
      }

      .surrender-modal-content {
        background-color: #fefefe;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        text-align: center;
        min-width: 300px;
      }

      .surrender-modal-content h2 {
        margin-top: 0;
        color: #333;
      }

      .surrender-modal-content p {
        color: #666;
        margin-bottom: 20px;
      }

      .modal-buttons {
        display: flex;
        gap: 10px;
        justify-content: center;
      }

      .modal-buttons button {
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
      }

      .surrender-btn {
        background-color: #dc3545;
        color: white;
      }

      .surrender-btn:hover {
        background-color: #c82333;
      }

      .cancel-btn {
        background-color: #6c757d;
        color: white;
      }

      .cancel-btn:hover {
        background-color: #5a6268;
      }

      .game-controls {
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
        justify-content: center;
      }

      .surrender-game-btn {
        background-color: #dc3545;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }

      .surrender-game-btn:hover {
        background-color: #c82333;
      }

      body[data-is-my-turn="false"] .cell {
        cursor: not-allowed;
        opacity: 0.6;
      }

      body[data-is-my-turn="false"] .cell .piece {
        pointer-events: none;
      }
    </style>
  </head>
  <body data-is-my-turn="{{ is_my_turn|lower }}">
    <!-- Кнопка для сдачи -->
    <div class="game-controls">
      <button class="surrender-game-btn" id="surrenderBtn">Сдаться</button>
    </div>

    <!-- Модальное окно подтверждения -->
    <div id="surrenderModal" class="surrender-modal">
      <div class="surrender-modal-content">
        <h2>⚠️ Вы уверены?</h2>
        <p>Вы уверены, что хотите сдаться? Эта партия будет засчитана как проигрыш.</p>
        <div class="modal-buttons">
          <button class="surrender-btn" id="confirmSurrender">Да, сдаться</button>
          <button class="cancel-btn" id="cancelSurrender">Отмена</button>
        </div>
      </div>
    </div>

    <!-- Диалог выбора фигуры при превращении -->
    <div id="promotion-dialog" style="display: none; justify-content: center">
      <button
        class="promotion-button"
        data-piece="q"
        style="background-color: rgba(0, 38, 255, 0.473)"
      >
        ♕
      </button>
      <button
        class="promotion-button"
        data-piece="r"
        style="background-color: rgba(43, 255, 0, 0.473)"
      >
        ♖
      </button>
      <button
        class="promotion-button"
        data-piece="b"
        style="background-color: rgba(195, 255, 0, 0.473)"
      >
        ♗
      </button>
      <button
        class="promotion-button"
        data-piece="n"
        style="background-color: rgba(255, 0, 0, 0.473)"
      >
        ♘
      </button>
    </div>

    <div id="board"></div>
    chess

    <script>
      localStorage.setItem("game_id", "{{game_id}}");
      localStorage.setItem("color", "{{color}}");
      localStorage.setItem("move_id", "{{last_move_id}}");
    </script>
    <script src="{% static 'js/surrender.js' %}"></script>
    <script src="{% static 'js/game.js' %}"></script>
  </body>
</html>
